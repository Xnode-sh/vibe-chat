<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vibe-chat · 2 в 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs"><i></i><i></i><i></i></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">✦</span>
      <div>
        <h1>vibe-chat</h1>
        <p>Claude Code + opencode · в одном чате</p>
      </div>
    </div>
    <div class="agents">
      <button class="agent claude" data-mode="claude"><span class="dot"></span>Claude Code</button>
      <button class="agent oc" data-mode="opencode"><span class="dot"></span>opencode</button>
      <button class="agent both active" data-mode="both"><span class="dot"></span>Оба 2 в 1</button>
      <button id="reset" class="reset" title="Новый чат">⟲</button>
    </div>
  </header>

  <main id="chat" class="chat">
    <div class="welcome">
      <div class="welcome-card">
        <div class="avatars"><span class="av claude-av">C</span><span class="av oc-av">O</span></div>
        <h2>Один чат, два мозга</h2>
        <p>Пиши — отвечает Claude Code, opencode или оба сразу. Без инструментов, чисто текст.</p>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="Спроси что-нибудь… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button id="send" title="Отправить">↑</button>
    </div>
    <div class="hint">режим: <b id="modeLabel">оба 2 в 1</b></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
